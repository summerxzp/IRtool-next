[package]
name = "irtool-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
irtool-core = { path = "../irtool-core" }
irtool-service = { path = "../irtool-service" }
irtool-process = { path = "../irtool-process" }
irtool-net-monitor = { path = "../irtool-net-monitor" }
irtool-autoruns = { path = "../irtool-autoruns" }
irtool-browser-forensics = { path = "../irtool-browser-forensics" }

eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = "0.31"
egui = "0.31"

arboard = "3"
regex = { workspace = true }

image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
parking_lot = "0.12"
serde = { workspace = true }
serde_json = { workspace = true }
webbrowser = "1.2"

tray-icon = "0.23"
muda = "0.19"

windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
