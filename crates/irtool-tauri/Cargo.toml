[package]
name = "irtool-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "irtool_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
irtool-core = { path = "../irtool-core" }
irtool-service = { path = "../irtool-service" }
irtool-net-monitor = { path = "../irtool-net-monitor" }
irtool-autoruns = { path = "../irtool-autoruns" }
irtool-sysmon = { path = "../irtool-sysmon" }
irtool-rules = { path = "../irtool-rules" }
irtool-threat-intel = { path = "../irtool-threat-intel" }
irtool-process = { path = "../irtool-process" }
irtool-monitor = { path = "../irtool-monitor" }
irtool-pcap = { path = "../irtool-pcap" }
irtool-tools = { path = "../irtool-tools" }
irtool-browser-forensics = { path = "../irtool-browser-forensics" }
irtool-egui = { path = "../irtool-egui", optional = true }

tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }

windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

chrono = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
rayon = "1.10"
parking_lot = "0.12"
serde = { workspace = true }
serde_json = { workspace = true }

specta = { workspace = true, features = ["derive", "serde"] }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
egui-fallback = ["irtool-egui"]
