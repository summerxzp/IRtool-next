name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# 并发控制：同一分支的新提交取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --exclude irtool-tauri -- -D warnings
      - name: cargo test
        run: cargo test --workspace --exclude irtool-tauri --no-fail-fast

  ui:
    name: UI check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm lint
      - name: Build
        run: pnpm build

  tauri-build:
    name: Tauri build smoke
    runs-on: windows-latest
    needs: [rust, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Build UI
        working-directory: ui
        run: pnpm build
      - name: Cargo build release
        run: cargo build --release -p irtool-tauri --features irtool-tauri/egui-fallback

  # 发布 release 时构建便携版
  release:
    name: Build portable package
    runs-on: windows-latest
    needs: [tauri-build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Build portable
        shell: pwsh
        run: |
          ./scripts/build-portable.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable
          path: dist/IRTool-*-portable.zip
